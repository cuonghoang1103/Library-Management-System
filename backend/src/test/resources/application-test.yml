spring:
  application:
    name: library-management-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Flyway for tests (using JPA ddl-auto instead)
  flyway:
    enabled: false

  h2:
    console:
      enabled: true

  # JWT Configuration for testing
  app:
    jwt:
      secret: test-secret-key-for-testing-purposes-only-must-be-at-least-256-bits-long-for-security
      expiration-ms: 86400000

logging:
  level:
    com.library: DEBUG
    org.springframework.security: DEBUG
